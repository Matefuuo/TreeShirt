<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TreeShirts</title>
    <link rel="stylesheet" href="Styles/Produ.css">

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
 
    <script>
        emailjs.init({
            publicKey: "0ZglCHa7-ONePTsMZ"
        });
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mrs+Sheppards&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://jsdelivr.net"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <header>
       
        <div class="logo-container" style="   width: 170px; height: 100px;">
            <img src="Styles/Img/logo.png" width="132.25" height="118   " alt="TreeShirts Logo" style=" position: relative;top: -10px;left: 10%;">
        </div>  
        <h1 class="mrs-sheppards-regular" style="color: white;">TreeShirts</h1>
    
        
        <div class="boards">

            <button class="board-button" >☰</button>

            <div class="menu-overlay" id="topMenu">
                <div class="menu-panel">
                    
                    <button class="menu-item mrs-sheppards-regular">Inicio</button>
                    <button class="menu-item mrs-sheppards-regular">Productos</button>
                    <button class="menu-item mrs-sheppards-regular">Galería</button>
                    <button class="menu-item mrs-sheppards-regular">Contacto</button>
                </div>
            </div> 
        </div>
    
        
    </header>

    <div class="contentform" style="background-image: url('Styles/Img/board4.png'); display: flex; gap: 50px; align-items: center; justify-content: center; min-height: 70vh;">
        <h2 class="mrs-sheppards-regular" style=" color: white;font-size: 5em; ">Contactanos por email</h2>

        <br>
        <br>

        <form class="form" style="display: flex; flex-direction: column; align-items: center; text-align: center;">
        <span class="input-span">
            <label for="email" class="label">Nombre</label>
            <input type="text"  id="nombre">
            <br>
            <label for="email" class="label">Email</label>
            <input type="email"  id="correo">
            <br>
            <label for="email" class="label">Comentario</label>
            <input type="text"  id="comentario">
            <br>
        </span>

        <input onclick="sendMail()" class="submit" type="submit" value="Submit" />
        </form>

    </div>

</body>
</html>
