<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TreeShirts</title>

    <link rel="stylesheet" href="Styles/Produ.css">

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- Inicializar EmailJS -->
    <script>
        emailjs.init({
            publicKey: "0ZglCHa7-ONePTsMZ"
        });
    </script>

    <!-- Tu JavaScript -->
    <script src="forms.js" defer></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Mrs+Sheppards&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <header>

        <div class="logo-container" style="width: 170px; height: 100px;">
            <img
                src="Styles/Img/logo.png"
                width="132.25"
                height="118"
                alt="TreeShirts Logo"
                style="position: relative; top: -10px; left: 10%;"
            >
        </div>

        <h1
            class="mrs-sheppards-regular"
            style="color: white;"
        >
            TreeShirts
        </h1>

        <div class="boards">

            <button class="board-button">
                ☰
            </button>

             <div class="menu-overlay" id="topMenu">
                <div class="menu-panel">
                    
                    <button class="menu-item mrs-sheppards-regular" onclick="window.location.href='index.html'">Inicio</button>
                    <button class="menu-item mrs-sheppards-regular" onclick="window.location.href='productos.html'">Productos</button>
                  
                    <button class="menu-item mrs-sheppards-regular" onclick="window.location.href='formulario.html'">Contacto</button>

                  
                </div>
            </div> 

        </div>

    </header>


    <div
        class="contentform"
        style="
            background-image: url('Styles/Img/board4.png');
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
        "
    >

        <h2
            class="mrs-sheppards-regular contentform-title"
            style="color: white;"
        >
            Contactanos por email
        </h2>


        <form
            class="form"
            style="
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
            "
        >

            <span class="input-span">

                <!-- Nombre -->
                <label for="nombre" class="label">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    required
                >

                <br>


                <!-- Email -->
                <label for="correo" class="label">
                    Email
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    required
                >

                <br>


                <!-- Comentario -->
                <label for="comentario" class="label">
                    Comentario
                </label>

                <input
                    type="text"
                    id="comentario"
                    name="comentario"
                    required
                >

                <br>

            </span>


            <!-- Botón -->
            <input
                id="submitButton"
                class="submit"
                type="button"
                value="Enviar"
                onclick="sendMail()"
            >

        </form>

    </div>

     <script  type="module"  >
        const boardButton = document.querySelector('.board-button');
        const topMenu = document.getElementById('topMenu');
        const closeMenu = document.getElementById('closeMenu');

        function toggleMenu() {
            topMenu.classList.toggle('open');
        }

        boardButton.addEventListener('click', toggleMenu);
        closeMenu.addEventListener('click', toggleMenu);
        topMenu.addEventListener('click', (event) => {
            if (event.target === topMenu) toggleMenu();
        });
    </script>

</body>

</html>
