<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TreeShirts</title>
    <link rel="stylesheet" href="Styles/Produ.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mrs+Sheppards&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://jsdelivr.net"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <header>
       
        <div class="logo-container" style="   width: 170px; height: 100px;">
            <img src="Styles/Img/logo.png" width="132.25" height="118   " alt="TreeShirts Logo" style=" position: relative;top: -10px;left: 10%;">
        </div>  
        <h1 class="mrs-sheppards-regular" style="color: white;">TreeShirts</h1>
    
        
        <div class="boards">

            <button class="board-button" >☰</button>

            <div class="menu-overlay" id="topMenu">
                <div class="menu-panel">
                    
                    <button class="menu-item mrs-sheppards-regular">Inicio</button>
                    <button class="menu-item mrs-sheppards-regular">Productos</button>
                    <button class="menu-item mrs-sheppards-regular">Galería</button>
                    <button class="menu-item mrs-sheppards-regular">Contacto</button>
                </div>
            </div> 
        </div>
    
        
    </header>

    <div class="contentform" style="background-image: url('..\\TreeShirt\\Styles\\Img\\board4.png'); display: flex; align-items: center; justify-content: center; min-height: 70vh;">
        <form class="form" style="display: flex; flex-direction: column; align-items: center; text-align: center;">
        <span class="input-span">
            <label for="email" class="label">Email</label>
            <input type="email" name="email" id="email"
        /></span>

        <input class="submit" type="submit" value="Log in" />
        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="text/javascript">
        const boardButton = document.querySelector('.board-button');
        const topMenu = document.getElementById('topMenu');
        const closeMenu = document.getElementById('closeMenu');

        function toggleMenu() {
            topMenu.classList.toggle('open');
        }

        boardButton.addEventListener('click', toggleMenu);
        closeMenu.addEventListener('click', toggleMenu);
        topMenu.addEventListener('click', (event) => {
            if (event.target === topMenu) toggleMenu();
        });
 
        // 1. Inicializar la herramienta con tu llave pública
        emailjs.init("Sn86-KK7B0R-ymWux");

        // 2. Obtener los elementos del formulario mediante el DOM
        const form = document.getElementById('contact-form');
        const submitBtn = document.getElementById('btn-submit');

        // 3. Escuchar el evento cuando el usuario presiona enviar
        form.addEventListener('submit', function(event) {
            event.preventDefault(); // Detener la recarga automática

            // Modificar el botón para indicar que está procesando
            submitBtn.value = "Enviando...";
            submitBtn.disabled = true;

            // 4. Hacer la conexión y envío de datos
            emailjs.sendForm('service_014tmfh', 'service_014tmfh', this)
                .then(function() {
                    alert('¡Mensaje enviado correctamente!');
                    form.reset(); // Vaciar las casillas
                }, function(error) {
                    alert('No se pudo enviar: ' + JSON.stringify(error));
                })
                .finally(function() {
                    // Devolver el botón a su estado original al terminar
                    submitBtn.value = "Enviar Mensaje";
                    submitBtn.disabled = false;
                });
        });
    </script>
</body>
</html>
